name: mycasapro-build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mycasapro
      POSTGRES_USER: mycasapro
      POSTGRES_PASSWORD: ${MYCASAPRO_DB_PASSWORD:-mycasapro_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycasapro -d mycasapro"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  app:
    build:
      context: ..
      dockerfile: app/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_STORE_BACKEND: postgres
      APP_DATABASE_URL: postgres://mycasapro:${MYCASAPRO_DB_PASSWORD:-mycasapro_local}@postgres:5432/mycasapro?sslmode=disable
      APP_AUTO_MIGRATE: "true"
      APP_PUBLIC_URL: http://127.0.0.1:${MYCASAPRO_PORT:-3210}
      APP_WEB_URL: http://127.0.0.1:${MYCASAPRO_PORT:-3210}
      APP_ALLOWED_ORIGINS: http://127.0.0.1:${MYCASAPRO_PORT:-3210},http://localhost:${MYCASAPRO_PORT:-3210}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        MYCASAPRO_INTERNAL_API_URL: http://app:8081
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYCASAPRO_PORT:-3210}:3000"
    depends_on:
      app:
        condition: service_healthy
    networks: [private]

volumes:
  postgres-data:
  uploads:

networks:
  private:
    driver: bridge
