name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: |
            app/go.sum
            cli/go.mod
      - run: go test ./...
        working-directory: app
      - run: go vet ./...
        working-directory: app
      - run: go test ./...
        working-directory: cli
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web

  images:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: app/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: api
            context: .
            file: app/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: web
            context: web
            file: web/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: web
            context: web
            file: web/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/fuzzyslippers412/mycasapro-${{ matrix.name }}:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}

  manifests:
    needs: images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [api, web]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/fuzzyslippers412/mycasapro-${{ matrix.name }}:${GITHUB_REF_NAME}" \
            --tag "ghcr.io/fuzzyslippers412/mycasapro-${{ matrix.name }}:latest" \
            "ghcr.io/fuzzyslippers412/mycasapro-${{ matrix.name }}:${GITHUB_REF_NAME}-amd64" \
            "ghcr.io/fuzzyslippers412/mycasapro-${{ matrix.name }}:${GITHUB_REF_NAME}-arm64"

  smoke:
    needs: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test published appliance
        env:
          MYCASAPRO_VERSION: ${{ github.ref_name }}
        run: ./infra/smoke-test.sh

  cli:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p dist stage
          targets=(
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
            "windows amd64"
            "windows arm64"
          )
          for target in "${targets[@]}"; do
            read -r os arch <<< "$target"
            output="stage/mycasapro"
            if [[ "$os" == "windows" ]]; then output="stage/mycasapro.exe"; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X main.version=$tag -X main.commit=$GITHUB_SHA" \
              -o "$output" ./cmd/mycasapro
            if [[ "$os" == "windows" ]]; then
              (cd stage && zip -q "../dist/mycasapro_${version}_${os}_${arch}.zip" mycasapro.exe)
              rm stage/mycasapro.exe
            else
              tar -C stage -czf "dist/mycasapro_${version}_${os}_${arch}.tar.gz" mycasapro
              rm stage/mycasapro
            fi
          done
          (cd dist && sha256sum mycasapro_* > checksums.txt)
        working-directory: cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release
          path: cli/dist/*
          if-no-files-found: error

  publish:
    needs: [smoke, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: cli-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
